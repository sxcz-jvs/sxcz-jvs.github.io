<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🍓 FrutiCine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(45deg, #ff4d4d, #ff9900);
    }

    h1 {
      font-size: 2.5em;
      margin: 0;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      background: black;
      padding: 12px 25px;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .container {
      padding: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🍓 FrutiCine</h1>
  <p>Las mejores frutinovelas virales</p>
  <a class="btn" href="https://tiktok.com" target="_blank">Ver ahora</a>
</header>

<div class="container">
  <div class="grid">

    <div class="card">
      <a href="https://tiktok.com" target="_blank">🎬 Episodio 1</a>
    </div>

    <div class="card">
      <a href="https://tiktok.com" target="_blank">🎬 Episodio 2</a>
    </div>

    <div class="card">
      <a href="https://tiktok.com" target="_blank">🎬 Episodio 3</a>
    </div>

  </div>
